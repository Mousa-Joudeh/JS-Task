<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Register</title>
        <link
            rel="stylesheet"
            href="style.css"
        />
    </head>
    <body>
        <div class="container">
            <h2>Register</h2>

            <form id="registerForm">
                <input
                    type="text"
                    id="fullName"
                    placeholder="Full Name"
                />

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                />

                <input
                    type="text"
                    id="address"
                    placeholder="Address"
                />

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                />

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                />

                <button type="submit">Register</button>

                <p id="message"></p>

                <p>
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </form>
        </div>

        <script src="register.js"></script>
    </body>
</html>
